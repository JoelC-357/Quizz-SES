            const currentData = level === 'premiere' ? quizDataPremiere : quizData;
            const levelOf = (q) => q.level || 'terminale';
            const levelWrong = wrongQuestions.filter(q => levelOf(q) === level);
            const bacId = level === 'premiere' ? 'bac_blanc_premiere' : 'bac_blanc';
            const baselineKey = level === 'premiere' ? 'ses_remediation_baseline_premiere' : 'ses_remediation_baseline';

            // Chronomètre de 15 minutes
            const [isTimerActive, setIsTimerActive] = useState(false);
            const [timeLeft, setTimeLeft] = useState(900);

            // Gestion du compte à rebours
            useEffect(() => {
                let timer;
                if (view === 'quiz' && isTimerActive && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft((prev) => prev - 1);
                    }, 1000);
                } else if (timeLeft === 0 && view === 'quiz') {
                    saveHighScore(score);
                    setView('summary');
                }
                return () => clearInterval(timer);
            }, [view, isTimerActive, timeLeft]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const handleStartQuiz = (chapter) => {
                setIsRemediationMode(false);
                const originalChapter = [...quizData, ...quizDataPremiere].find(c => c.id === chapter.id) || chapter;
                const randomQuestions = shuffle(originalChapter.questions);
                const finalShuffledQuestions = randomQuestions.map(q => ({
                    ...q,
                    options: shuffle(q.options)
                }));

                setSelectedChapter({
                    ...originalChapter,
                    questions: finalShuffledQuestions
                });
                resetQuizState();
            };

            const handleStartBacBlanc = () => {
                setIsRemediationMode(false);
                // 2 questions tirées dans chaque chapitre du niveau choisi, puis complément au hasard jusqu'à 20
                let picked = [];
                let remaining = [];
                currentData.forEach(chap => {
                    const shuffled = shuffle(chap.questions);
                    picked = picked.concat(shuffled.slice(0, 2));
                    remaining = remaining.concat(shuffled.slice(2));
                });
                picked = picked.concat(shuffle(remaining).slice(0, Math.max(0, 20 - picked.length)));
                const pickedQuestions = shuffle(picked);
                const finalQuestions = pickedQuestions.map(q => ({
                    ...q,
                    options: shuffle(q.options)
                }));

                setSelectedChapter({
                    id: bacId,
                    title: level === 'premiere' ? "Entraînement global - Première" : "Marathon Bac Blanc - Épreuve Globale",
                    questions: finalQuestions
                });
                resetQuizState();
            };

            const handleStartRemediation = () => {
                if (levelWrong.length === 0) return;
                setIsRemediationMode(true);

                setSelectedChapter({
                    id: "remediation",
                    title: "Module de Remédiation Personnalisé",
                    questions: shuffle(levelWrong).map(q => ({
                        ...q,
                        options: shuffle(q.options)
                    }))
                });
                resetQuizState();
            };

            const resetQuizState = () => {
                setCurrentQuestionIndex(0);
                setSelectedOptionIndex(null);
                setIsSubmitted(false);
                setScore(0);
                setUserAnswers([]);
                setTimeLeft(900);
                setView('quiz');
            };

            const handleOptionSelect = (index) => {
                if (isSubmitted) return;
                setSelectedOptionIndex(index);
            };

            const handleSubmitAnswer = () => {
                if (selectedOptionIndex === null) return;

                const questionObj = selectedChapter.questions[currentQuestionIndex];
                const selectedOption = questionObj.options[selectedOptionIndex];
                const correctOptionIndex = questionObj.options.findIndex(opt => opt.isCorrect);
                const isCorrect = selectedOption.isCorrect;

                if (isCorrect) {
                    setScore(prev => prev + 1);
                    if (isRemediationMode) {
                        setWrongQuestions(prev => {
                            const updated = prev.filter(q => q.question !== questionObj.question);
                            localStorage.setItem('ses_wrong_questions', JSON.stringify(updated));
                            if (updated.filter(q => levelOf(q) === level).length === 0) {
                                localStorage.setItem(baselineKey, '0');
                            }
                            return updated;
                        });
                    }
                } else {
                    setWrongQuestions(prev => {
                        if (prev.some(q => q.question === questionObj.question)) return prev;
                        const updated = [...prev, { ...questionObj, level: levelOf(questionObj) }];
                        localStorage.setItem('ses_wrong_questions', JSON.stringify(updated));

                        const levelCount = updated.filter(q => levelOf(q) === level).length;
                        const baseline = parseInt(localStorage.getItem(baselineKey) || '0');
                        if (levelCount > baseline) {
                            localStorage.setItem(baselineKey, levelCount.toString());
                        }
                        return updated;
                    });
                }

                setUserAnswers([...userAnswers, {
                    question: questionObj.question,
                    selectedOptionText: selectedOption.text,
                    correctOptionText: questionObj.options[correctOptionIndex].text,
                    isCorrect: isCorrect,
                    rationale: questionObj.options[correctOptionIndex].rationale
                }]);

                setIsSubmitted(true);
            };

            const saveHighScore = (finalScore) => {
                if (isRemediationMode || !selectedChapter) return;
                const currentHighScore = highScores[selectedChapter.id] || 0;
                if (finalScore > currentHighScore) {
                    const updatedScores = { ...highScores, [selectedChapter.id]: finalScore };
                    localStorage.setItem('ses_high_scores', JSON.stringify(updatedScores));
                    setHighScores(updatedScores);
                }
            };

            const handleNextQuestion = () => {
                if (currentQuestionIndex + 1 < selectedChapter.questions.length) {
                    setCurrentQuestionIndex(prev => prev + 1);
                    setSelectedOptionIndex(null);
                    setIsSubmitted(false);
                } else {
                    saveHighScore(score);
                    setView('summary');
                }
            };

            const errorBaseline = Math.max(levelWrong.length, parseInt(localStorage.getItem(baselineKey) || '0'));
            const errorsCleared = errorBaseline - levelWrong.length;
            const recoveryPercent = errorBaseline > 0 ? Math.round((errorsCleared / errorBaseline) * 100) : 0;

            const bestBacScore = highScores[bacId];
            let bacMedal = null;
            if (bestBacScore !== undefined) {
                if (bestBacScore === 20) bacMedal = "🥇";
                else if (bestBacScore >= 16) bacMedal = "🥈";
                else if (bestBacScore >= 10) bacMedal = "🥉";
            }

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    {/* BARRE DE NAVIGATION BANDEAU */}
                    <header className="bg-white border-b border-slate-200 py-4 shadow-sm sticky top-0 z-50">
                        <div className="max-w-5xl mx-auto px-4 flex justify-between items-center">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('dashboard')}>
                                <div className="bg-gradient-to-r from-blue-600 to-indigo-600 p-2.5 rounded-xl text-white shadow-md shadow-indigo-100">
                                    <i className="fa-solid fa-graduation-cap text-xl"></i>
                                </div>
                                <div>
                                    {/* MODIFIÉ : AJOUT DE VOTRE NOM DIRECTEMENT ICI */}
                                    <h1 className="font-extrabold text-lg text-slate-900 tracking-tight">SES {level === 'premiere' ? 'Première' : 'Terminale'} - M. Chachero</h1>
                                    <p className="text-xs text-slate-500 font-medium">{level === 'premiere' ? 'Révisions de Première' : 'Révisions du Baccalauréat'}</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-3">
                                {/********* BOUTON REMÉDIATION *********/}
                                {(view === 'dashboard' || view === 'authors') && (
                                    <button
                                        onClick={levelWrong.length > 0 ? handleStartRemediation : null}
                                        disabled={levelWrong.length === 0}
                                        className={`text-sm font-bold px-3 py-2 rounded-xl flex items-center space-x-1.5 transition border ${
                                            levelWrong.length > 0
                                                ? "text-amber-700 bg-amber-50 hover:bg-amber-100 border-amber-200 shadow-sm shadow-amber-50"
                                                : "text-slate-400 bg-slate-50 border-slate-200 opacity-60 cursor-not-allowed"
                                        }`}
                                    >
                                        <i className="fa-solid fa-kit-medical"></i>
                                        <span>Remédiation {levelWrong.length > 0 ? `(${levelWrong.length} | ${recoveryPercent}%)` : ""}</span>
                                    </button>
                                )}

                                {/********* BOUTON CITATIONS & AUTEURS *********/}
                                {view !== 'authors' && level === 'terminale' && (
                                    <button
                                        onClick={() => setView('authors')}
                                        className="text-sm font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-2 rounded-xl flex items-center space-x-1.5 transition border border-indigo-100"
                                    >
                                        <i className="fa-solid fa-book-bookmark"></i>
                                        <span className="hidden sm:inline">Auteurs & idées clés</span>
                                    </button>
                                )}
                                {view !== 'dashboard' && (
                                    <button onClick={() => setView('dashboard')} className="text-sm font-semibold text-slate-600 hover:text-slate-900 flex items-center space-x-1.5 transition">
                                        <i className="fa-solid fa-arrow-left"></i>
                                        <span>Retour</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* ZONE CENTRALE DYNAMIQUE */}
                    <main className="max-w-5xl w-full mx-auto px-4 py-8 flex-grow flex items-center justify-center">

                        {/* VIEW 1 : TABLEAU DE BORD ACCUEIL */}
                        {view === 'dashboard' && (
                            <div className="w-full">
                                <div className="text-center mb-8">
                                    <div className="mb-5">
                                        <div className="inline-flex bg-slate-100 border border-slate-200 rounded-2xl p-1">
                                            {[['premiere', 'Première'], ['terminale', 'Terminale']].map(([lv, label]) => (
                                                <button key={lv} onClick={() => changeLevel(lv)} className={`px-6 py-2 rounded-xl text-sm font-bold transition ${level === lv ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>{label}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <span className="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider">Session Active : Mode Autonome</span>
                                    <h2 className="text-3xl font-extrabold text-slate-900 tracking-tight mt-3 mb-2">{level === 'premiere' ? 'Révisez les chapitres de Première' : "Entraînez-vous pour l'Épreuve Écrite"}</h2>
                                    <p className="text-slate-500 max-w-xl mx-auto text-sm">Configurez l'évaluation puis cliquez sur le bouton d'examen global ou choisissez un chapitre thématique.</p>
                                </div>

                                {/* PANNEAU DE COMMANDE COMBINÉ (CHRONO + MARATHON BAC BLANC ACCOLLÉS) */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl mx-auto mb-10">
                                    <div className="flex items-center space-x-4 bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                                        <div className="bg-slate-100 p-2.5 rounded-xl text-slate-600"><i className="fa-solid fa-stopwatch text-lg"></i></div>
                                        <div className="flex-grow">
                                            <span className="block text-sm font-bold text-slate-800">Mode Examen Chronométré</span>
                                            <span className="block text-xs text-slate-400 font-medium">15 minutes pour finir la session</span>
                                        </div>
                                        <button onClick={() => setIsTimerActive(!isTimerActive)} className={`relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${isTimerActive ? 'bg-blue-600' : 'bg-slate-200'}`}>
                                            <span className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${isTimerActive ? 'translate-x-5' : 'translate-x-0'}`}></span>
                                        </button>
                                    </div>

                                    <div className="bg-gradient-to-br from-violet-600 to-indigo-700 text-white border border-indigo-100 rounded-2xl p-4 shadow-sm hover:shadow-md transition duration-300 flex items-center justify-between cursor-pointer group" onClick={handleStartBacBlanc}>
                                        <div className="flex items-center space-x-4">
                                            <div className="w-10 h-10 rounded-xl bg-white/20 text-white flex items-center justify-center shadow-md"><i className="fa-solid fa-file-signature text-base"></i></div>
                                            <div>
                                                <h3 className="font-extrabold text-white text-sm leading-tight">{level === 'premiere' ? 'Entraînement global' : 'Marathon Bac Blanc'}</h3>
                                                <p className="text-[11px] text-indigo-100 font-medium">20 questions sur tous les chapitres</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center space-x-2">
                                            {bestBacScore !== undefined && (
                                                <span className="text-xs font-extrabold bg-white/20 px-2 py-0.5 rounded-full border border-white/10">
                                                    {bacMedal} {bestBacScore}/20
                                                </span>
                                            )}
                                            <i className="fa-solid fa-play group-hover:translate-x-1 transition text-xs"></i>
                                        </div>
                                    </div>
                                </div>

                                {/* GRILLE DES CHAPITRES DU NIVEAU CHOISI */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {currentData.map((chap) => {
                                        const bestScore = highScores[chap.id];
                                        let medalElement = null;

                                        if (bestScore !== undefined) {
                                            const successRatio = bestScore / chap.questions.length;
                                            if (successRatio === 1) medalElement = { icon: "fa-trophy text-amber-500 text-lg", bg: "bg-amber-50 border-amber-200 text-amber-800", text: "🥇 Or" };
                                            else if (successRatio >= 0.75) medalElement = { icon: "fa-medal text-slate-400 text-lg", bg: "bg-slate-50 border-slate-200 text-slate-700", text: "🥈 Argent" };
                                            else if (successRatio >= 0.5) medalElement = { icon: "fa-medal text-amber-700 text-lg", bg: "bg-orange-50 border-orange-100 text-orange-800", text: "🥉 Bronze" };
                                        }

                                        return (
                                            <div key={chap.id} className="bg-white border border-slate-150 rounded-2xl p-6 shadow-sm hover:shadow-md transition duration-300 flex flex-col justify-between cursor-pointer group" onClick={() => handleStartQuiz(chap)}>
                                                <div>
                                                    <div className="flex justify-between items-start mb-5">
                                                        <div className={`w-12 h-12 rounded-xl bg-gradient-to-br ${chap.color} text-white flex items-center justify-center shadow-lg shadow-slate-100 group-hover:scale-105 transition`}><i className={`fa-solid ${chap.icon} text-lg`}></i></div>
                                                        {medalElement && (
                                                            <span className={`flex items-center space-x-1.5 border px-2.5 py-1 rounded-full text-xs font-extrabold shadow-sm ${medalElement.bg}`}>
                                                                <i className={`fa-solid ${medalElement.icon}`}></i>
                                                                <span>{bestScore}/{chap.questions.length}</span>
                                                            </span>
                                                        )}
                                                    </div>
                                                    <h3 className="font-bold text-slate-900 text-base leading-tight mb-2 group-hover:text-blue-600 transition">{chap.title}</h3>
                                                    <p className="text-xs text-slate-500 font-medium">{chap.questions.length} Questions dispo</p>
                                                </div>
                                                <div className="mt-6 flex items-center justify-between text-xs font-semibold text-blue-600 pt-4 border-t border-slate-50">
                                                    <span>{bestScore !== undefined ? "S'entraîner à nouveau" : "Démarrer"}</span>
                                                    <i className="fa-solid fa-chevron-right group-hover:translate-x-1 transition"></i>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* VIEW 2 : INDEX DES AUTEURS ET CITATIONS */}
                        {view === 'authors' && (
                            <div className="w-full max-w-4xl animate-fadeIn">
                                <div className="text-center mb-8">
                                    <span className="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider">Boîte à outils Pédagogique</span>
                                    <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight mt-3 mb-1">Auteurs et idées clés de Terminale</h2>
                                    <p className="text-slate-500 text-sm">Les arguments théoriques incontournables pour étayer vos dissertations et EC3.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {authorsData.map((author, index) => (
                                        <div key={index} className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between space-y-4">
                                            <div>
                                                <div className="flex justify-between items-start mb-2">
                                                    <h3 className="font-extrabold text-slate-900 text-lg">{author.name}</h3>
                                                    <span className="bg-slate-100 text-slate-600 text-xs font-semibold px-2.5 py-1 rounded-md">{author.theme}</span>
                                                </div>
                                                <p className="text-xs text-indigo-600 font-bold mb-3 uppercase tracking-wider">Thèse : {author.thesis}</p>
                                                <div className="bg-slate-50 border-l-4 border-indigo-500 p-3 rounded-r-xl my-2">
                                                    <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">{author.kind === "citation" ? "Citation" : "Idée clé (reformulation : ne pas mettre entre guillemets)"}</p>
                                                    <p className={`text-sm font-medium text-slate-700 leading-relaxed ${author.kind === "citation" ? "italic" : ""}`}>{author.kind === "citation" ? `« ${author.quote} »` : author.quote}</p>
                                                    {author.source && <p className="text-xs text-slate-500 mt-2">— {author.source}</p>}
                                                </div>
                                            </div>
                                            <div className="bg-emerald-50/50 border border-emerald-100 rounded-xl p-3 text-xs text-emerald-800 leading-relaxed">
                                                <strong>💡 Comment l'utiliser au Bac :</strong> {author.tip}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="text-center mt-8">
                                    <button onClick={() => setView('dashboard')} className="bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-8 rounded-xl transition text-sm shadow-md">Retourner aux entraînements</button>
                                </div>
                            </div>
                        )}

                        {/* VIEW 3 : SESSION DE QUIZ ACTIVE */}
                        {view === 'quiz' && selectedChapter && (
                            <div className="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-xl shadow-slate-100 max-w-2xl w-full">
                                <div className="flex justify-between items-center border-b border-slate-100 pb-4 mb-6">
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">{selectedChapter.title}</span>
                                    <div className="flex items-center space-x-3">
                                        {isTimerActive && (
                                            <span className={`text-xs font-extrabold px-3 py-1.5 rounded-full flex items-center space-x-1.5 ${timeLeft < 60 ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-amber-100 text-amber-700'}`}>
                                                <i className="fa-solid fa-clock"></i>
                                                <span>{formatTime(timeLeft)}</span>
                                            </span>
                                        )}
                                        <span className="bg-slate-100 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-full">Question {currentQuestionIndex + 1} / {selectedChapter.questions.length}</span>
                                    </div>
                                </div>

                                <div className="w-full bg-slate-100 h-1.5 rounded-full mb-6">
                                    <div className="bg-blue-600 h-1.5 rounded-full transition-all duration-300" style={{ width: `${((currentQuestionIndex + 1) / selectedChapter.questions.length) * 100}%` }}></div>
                                </div>

                                <h3 className="text-lg font-bold text-slate-900 mb-6 leading-snug">{selectedChapter.questions[currentQuestionIndex].question}</h3>

                                <div className="space-y-3 mb-6">
                                    {selectedChapter.questions[currentQuestionIndex].options.map((opt, idx) => {
                                        let optionBgClass = "border-slate-200 hover:border-blue-500 hover:bg-slate-50";
                                        let icon = null;

                                        if (selectedOptionIndex === idx) optionBgClass = "border-blue-500 bg-blue-50";

                                        if (isSubmitted) {
                                            if (opt.isCorrect) {
                                                optionBgClass = "border-emerald-500 bg-emerald-50 text-emerald-900";
                                                icon = <i className="fa-solid fa-circle-check text-emerald-600 text-lg"></i>;
                                            } else if (selectedOptionIndex === idx) {
                                                optionBgClass = "border-rose-500 bg-rose-50 text-rose-900";
                                                icon = <i className="fa-solid fa-circle-xmark text-rose-600 text-lg"></i>;
                                            } else {
                                                optionBgClass = "border-slate-200 opacity-60";
                                            }
                                        }

                                        return (
                                            <button key={idx} onClick={() => handleOptionSelect(idx)} disabled={isSubmitted} className={`w-full text-left border rounded-2xl p-4 flex justify-between items-center transition font-medium text-sm leading-relaxed ${optionBgClass}`}>
                                                <span>{opt.text}</span>
                                                {icon}
                                            </button>
                                        );
                                    })}
                                </div>

                                {isSubmitted ? (
                                    <div className="mt-6 pt-6 border-t border-slate-100">
                                        <div className={`p-4 rounded-2xl mb-6 text-sm leading-relaxed ${selectedChapter.questions[currentQuestionIndex].options[selectedOptionIndex].isCorrect ? "bg-emerald-50 text-emerald-800 border border-emerald-100" : "bg-rose-50 text-rose-800 border border-rose-100"}`}>
                                            <p className="font-bold mb-1">{selectedChapter.questions[currentQuestionIndex].options[selectedOptionIndex].isCorrect ? "Correct !" : "Faux"}</p>
                                            <p>{selectedChapter.questions[currentQuestionIndex].options[selectedOptionIndex].rationale}</p>
                                        </div>
                                        <button onClick={handleNextQuestion} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 px-6 rounded-2xl transition shadow-md shadow-slate-200">Question suivante</button>
                                    </div>
                                ) : (
                                    <button onClick={handleSubmitAnswer} disabled={selectedOptionIndex === null} className={`w-full font-bold py-4 px-6 rounded-2xl transition shadow-md ${selectedOptionIndex !== null ? "bg-blue-600 hover:bg-blue-700 text-white shadow-blue-100" : "bg-slate-100 text-slate-400 cursor-not-allowed shadow-none"}`}>Valider</button>
                                )}
                            </div>
                        )}

                        {/* VIEW 4 : BILAN DE FIN DE QUIZ */}
                        {view === 'summary' && selectedChapter && (
                            <div className="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-xl shadow-slate-100 max-w-2xl w-full">
                                <div className="text-center mb-8">
                                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${timeLeft === 0 ? 'bg-rose-50 text-rose-600' : 'bg-indigo-50 text-indigo-600'}`}><i className={`fa-solid ${timeLeft === 0 ? 'fa-hourglass-end animate-bounce' : 'fa-trophy'} text-2xl`}></i></div>
                                    <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">{timeLeft === 0 ? "Temps Écoulé !" : isRemediationMode ? "Remédiation Terminée !" : "Fin du Quiz"}</h2>
                                    <p className="text-slate-500 text-sm mt-1">{selectedChapter.title}</p>
                                </div>

                                <div className="bg-slate-50 border border-slate-150 rounded-2xl p-6 text-center mb-8">
                                    <p className="text-sm font-bold text-slate-500 uppercase tracking-widest">Score de session</p>
                                    <h3 className="text-5xl font-extrabold text-slate-900 mt-2 mb-1">{score} / {selectedChapter.questions.length}</h3>
                                    {timeLeft === 0 && <p className="text-xs text-rose-600 font-bold mt-2">Le chrono a expiré avant que vous ne terminiez le questionnaire.</p>}
                                </div>

                                <div className="space-y-4 mb-8 max-h-[250px] overflow-y-auto pr-2">
                                    <h4 className="font-bold text-sm text-slate-900 border-b border-slate-100 pb-2">Détails de vos réponses :</h4>
                                    {userAnswers.map((ans, idx) => (
                                        <div key={idx} className="p-4 border border-slate-100 rounded-xl text-xs space-y-1.5 leading-relaxed bg-slate-50">
                                            <p className="font-bold text-slate-800">Q{idx + 1}: {ans.question}</p>
                                            <div className="flex items-center space-x-2">
                                                <span className="font-semibold text-slate-500">Votre réponse :</span>
                                                <span className={ans.isCorrect ? "text-emerald-600 font-bold" : "text-rose-600 font-bold"}>{ans.selectedOptionText}</span>
                                            </div>
                                            {!ans.isCorrect && (
                                                <div className="flex items-center space-x-2">
                                                    <span className="font-semibold text-slate-500">La bonne réponse :</span>
                                                    <span className="text-emerald-600 font-bold">{ans.correctOptionText}</span>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <div className="flex space-x-4">
                                    <button onClick={() => { if (selectedChapter.id.startsWith("bac_blanc")) { handleStartBacBlanc(); } else if (isRemediationMode) { levelWrong.length > 0 ? handleStartRemediation() : setView('dashboard'); } else { handleStartQuiz(selectedChapter); } }} className="flex-1 border border-slate-200 hover:border-slate-300 font-bold py-4 px-6 rounded-2xl transition text-slate-700 text-sm">Recommencer</button>
                                    <button onClick={() => setView('dashboard')} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl transition shadow-md shadow-blue-100 text-sm">Retour à l'accueil</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Pied de page */}
                    <footer className="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400 font-medium">
                        <div className="max-w-5xl mx-auto px-4">
                            <p>© 2026 SES Première et Terminale - Plateforme Éducative</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
