                            { text: "Le processus par lequel les individus s'intègrent à la société à travers le partage de normes et de valeurs communes.", isCorrect: false, rationale: "Confusion : cela désigne la socialisation ou l'intégration sociale, pas la stratification." },
                            { text: "La répartition statistique de la population active selon les trois grands secteurs de l'activité économique.", isCorrect: false, rationale: "Confusion : cela désigne la structure sectorielle de l'économie, pas la hiérarchisation des groupes sociaux." }
                        ]
                    },
                    {
                        question: "Quels sont les principaux critères socio-économiques et démographiques qui structurent l'espace social français ?",
                        options: [
                            { text: "La profession (PCS), le niveau de diplôme, le genre, le cycle de vie et le lieu de résidence.", isCorrect: true, rationale: "L'espace social est multidimensionnel : la position d'un individu dépend de sa situation professionnelle et économique, mais aussi d'autres facteurs structurants comme le genre, l'âge (cycle de vie) ou son territoire." },
                            { text: "Le niveau de revenu, le patrimoine mobilier et le taux d'épargne annuel de l'ensemble des ménages.", isCorrect: false, rationale: "Piège : ce sont des critères importants, mais purement économiques. Ils oublient les critères démographiques et culturels (genre, diplôme)." },
                            { text: "Le statut juridique de l'employeur, la taille de l'entreprise et la branche d'activité industrielle.", isCorrect: false, rationale: "Confusion : ce sont des critères d'économie d'entreprise pour classer les structures productives, pas les individus dans l'espace social." },
                            { text: "Les préférences politiques, le statut matrimonial et le nombre d'enfants à charge par famille.", isCorrect: false, rationale: "Bien que liés, ce ne sont pas les variables lourdes utilisées en sociologie pour cartographier la stratification." }

                    {

                            { text: "L'harmonisation progressive et continue des salaires entre les différentes catégories socioprofessionnelles.", isCorrect: false, rationale: "Confusion fréquente d'élève : la salarisation désigne le statut juridique de l'emploi (contrat, subordination), pas l'égalisation des revenus." },
                            { text: "La part croissante des revenus de transfert dans le revenu disponible brut global des ménages.", isCorrect: false, rationale: "Confusion : cela correspond aux mécanismes de la redistribution de l'État-providence." },
                            { text: "L'accès massif des femmes aux postes d'encadrement et de haute direction dans le secteur privé.", isCorrect: false, rationale: "Confusion : cela fait référence à la féminisation ou au bris du plafond de verre, pas à la salarisation." }

                    {
                        question: "Quel impact la 'tertiarisation' a-t-elle eu sur la structure socioprofessionnelle française ?",
                        options: [
                            { text: "Le déclin des emplois agricoles et industriels au profit des services, entraînant l'essor des employés et professions intermédiaires.", isCorrect: true, rationale: "La tertiarisation correspond à l'essor du secteur tertiaire (commerce, santé, éducation, loisirs, administration) qui emploie désormais la grande majorité de la population active." },
                            { text: "L'augmentation de la productivité globale des facteurs au sein du secteur de la recherche technologique.", isCorrect: false, rationale: "Confusion : c'est un concept de croissance économique (offre), pas une mutation de la structure des emplois." },
                            { text: "Le passage historique de la production artisanale à la production industrielle de masse dans les usines.", isCorrect: false, rationale: "Anachronisme : cela décrit l'industrialisation du XIXe siècle, pas la tertiarisation moderne." },
                            { text: "La hausse spectaculaire de la part des cadres supérieurs au détriment des employés non qualifiés.", isCorrect: false, rationale: "Faux : la tertiarisation a d'abord fait exploser la catégorie des employés (tertiaire populaire), pas seulement les cadres." }

                    },
                    {

                            { text: "L'obtention d'une égalité salariale parfaite entre les hommes et les femmes à poste et diplôme équivalents.", isCorrect: false, rationale: "Confusion : l'égalité salariale est un objectif légal et social, tandis que la féminisation mesure simplement la présence quantitative des femmes sur le marché." },

                            { text: "La baisse structurelle du taux d'activité des hommes pour compenser l'arrivée des femmes dans les entreprises.", isCorrect: false, rationale: "Faux : l'arrivée des femmes n'a pas provoqué le retrait des hommes du marché du travail." }

            {
                id: "action_publique_environnement",
                title: "6. L'action publique pour l'environnement",
                icon: "fa-leaf",
                color: "from-teal-500 to-green-600",
                questions: [
                    {
                        question: "Quels sont les différents types d'acteurs qui participent à la mise à l'agenda des questions environnementales ?",
                        options: [
                            { text: "Les pouvoirs publics, les ONG, les partis politiques, les entreprises, les scientifiques et les mouvements citoyens.", isCorrect: true, rationale: "La mise à l'agenda politique résulte des interactions (conflits, négociations) entre une multitude d'acteurs d'échelles différentes." },
                            { text: "L'Organisation des Nations Unies de manière centralisée, unilatérale et sans concertation avec les échelons locaux.", isCorrect: false, rationale: "Faux : l'action publique environnementale implique de vifs conflits et des interactions entre une multitude d'échelons locaux et nationaux." },
                            { text: "Les seules entreprises polluantes qui décident de façon autonome de modifier les réglementations du marché.", isCorrect: false, rationale: "Inversion : ce sont généralement les ONG, la société civile et les experts scientifiques (GIEC) qui forcent les entreprises à réagir." },
                            { text: "Les administrations chargées de la gestion exclusive des compétitions sportives et de l'aménagement touristique.", isCorrect: false, rationale: "Faux : ces services peuvent être concernés marginalement, mais ne constituent pas les acteurs moteurs de l'action publique." }

                    },
                    {
                        question: "Comment caractériser les relations entre les acteurs de la protection de l'environnement ?",
                        options: [
                            { text: "Elles combinent des phases de coopération (expertises communes) et des phases de conflit (procès, manifestations).", isCorrect: true, rationale: "Les ONG collaborent parfois avec l'État ou les entreprises, mais mènent aussi des luttes judiciaires ou de désobéissance civile lorsque le dialogue est bloqué." },
                            { text: "Un consensus permanent et une entente parfaite exempte de tout désaccord théorique ou économique.", isCorrect: false, rationale: "Faux : les arbitrages financiers ou écologiques (ex: taxation carbone) génèrent de vifs conflits d'intérêts entre les acteurs." },
                            { text: "Une opposition violente et systématique interdisant l'établissement de tout espace de dialogue avec les chefs d'entreprise.", isCorrect: false, rationale: "Faux : il existe de nombreuses négociations, chartes volontaires de responsabilité sociétale (RSE) et accords de transition." },
                            { text: "Un contrôle souverain des ONG qui rédigent et imposent directement les lois environnementales à l'État.", isCorrect: false, rationale: "Faux : les ONG exercent un rôle de lobbying ou de pression, mais le pouvoir législatif reste l'apanage exclusif des autorités publiques." }

                    },
                    {
                        question: "Quelle échelle d'action environnementale illustre le principe de gouvernance multi-niveaux ?",
                        options: [
                            { text: "La coordination articulée entre l'échelon local (communes), national (États) et supranational (directives européennes, traités mondiaux).", isCorrect: true, rationale: "L'écologie exige des actions de proximité (gestion des déchets) et des régulations mondiales (émissions de CO2), rendant nécessaire l'articulation multi-niveaux." },
                            { text: "Le transfert de la totalité du pouvoir décisionnel vers l'échelon mondial pour supprimer les parlements nationaux.", isCorrect: false, rationale: "Confusion : le principe de subsidiarité ou multi-niveaux cherche à articuler les compétences, pas à centraliser le pouvoir de façon exclusive en haut." },
                            { text: "Une centralisation exclusive des décisions au niveau de l'État qui interdit toute initiative des communes et des régions.", isCorrect: false, rationale: "Inversion : l'action locale (ex: plans climats territoriaux) joue un rôle majeur et complémentaire dans la mise en œuvre des politiques." },
                            { text: "L'autonomie totale de chaque pays qui refuse de signer le moindre accord ou traité de régulation international.", isCorrect: false, rationale: "Faux : face à des problèmes globaux (climat, océans), le repli purement national s'avère inefficace car la pollution ne s'arrête pas aux frontières." }
                        ]
                    },
                    {
                        question: "Qu'est-ce qu'une politique de réglementation environnementale ?",
                        options: [
                            { text: "L'imposition de normes juridiques obligatoires fixant des limites ou des procédés sous peine de sanctions.", isCorrect: true, rationale: "La réglementation est une mesure de contrainte directe (ex: interdiction des moteurs thermiques en 2035, interdiction des sacs plastiques)." },
                            { text: "L'attribution d'aides financières aux entreprises pour réduire le coût de remplacement de leurs machines.", isCorrect: false, rationale: "Confusion d'instrument : cela correspond à la politique de subvention, qui utilise une incitation positive et non une contrainte." },
                            { text: "L'application d'une taxe pigouvienne sur le prix des carburants afin de modifier le comportement des usagers.", isCorrect: false, rationale: "Confusion d'instrument : cela correspond à l'instrument fiscal (taxation), qui passe par le signal-prix et non par la loi obligatoire." },
                            { text: "Une campagne de communication publique incitant les citoyens à adopter des éco-gestes volontaires au quotidien.", isCorrect: false, rationale: "Confusion : les campagnes relèvent de la sensibilisation ou de l'incitation morale, tandis que la réglementation revêt un caractère obligatoire et coercitif." }
                        ]
                    },
                    {
                        question: "Comment fonctionne la fiscalité environnementale (taxation) ?",
                        options: [
                            { text: "En augmentant le prix des activités polluantes pour inciter les agents à modifier leurs comportements (signal-prix).", isCorrect: true, rationale: "La taxe carbone augmente le prix des énergies fossiles. Pour payer moins, les ménages et les entreprises sont incités à consommer des énergies propres." },
                            { text: "En interdisant de manière stricte et définitive toute émission de gaz à effet de serre sur le territoire.", isCorrect: false, rationale: "Confusion d'instrument : la taxe n'interdit pas (contrairement à la norme), elle donne un prix à la pollution pour laisser le choix économique aux agents." },
                            { text: "En distribuant des primes financières aux ménages modestes pour réaliser des travaux d'isolation thermique.", isCorrect: false, rationale: "Confusion d'instrument : cela désigne le mécanisme de la subvention environnementale, pas du prélèvement fiscal." },
                            { text: "En fixant une limite maximale de rejets de CO2 que les sites industriels ne doivent pas dépasser sous peine d'amende.", isCorrect: false, rationale: "Confusion d'instrument : fixer un plafond légal correspond à l'usage d'une norme de rejet (réglementation)." }
                        ]
                    }
                ]
            }
        ];

        // Base de données des Auteurs et Citations[cite: 1]
        const authorsData = [
            {
                name: "Joseph Schumpeter",
                theme: "Croissance & Progrès technique",
                thesis: "L'innovation est un processus discontinu qui bouscule l'économie par vagues.",
                quote: "L'impulsion fondamentale qui met et maintient en mouvement la machine capitaliste sourd des nouveaux biens de consommation, des nouvelles méthodes de production [...], ce processus de Destruction Créatrice constitue la donnée fondamentale du capitalisme.",
                tip: "Idéal pour introduire ou illustrer l'impact des vagues d'innovations technologiques sur l'obsolescence de certains secteurs industriels (EC3 ou dissertation sur le progrès technique)."
            },
            {
                name: "Robert Solow",
                theme: "Sources de la croissance",
                thesis: "La croissance à long terme dépend fondamentalement du progrès technique, le 'résidu'.",
                quote: "Le progrès technique est un résidu, une mesure de notre ignorance face aux déterminants réels de l'efficacité productive.",
                tip: "Utile pour montrer la transition historique entre la croissance extensive (accumulation des facteurs) et la croissance intensive (gains de productivité via la PGF)."
            },
            {

                theme: "Commerce International",
                thesis: "Tous les pays gagnent au libre-échange en se spécialisant là où ils sont comparativement les meilleurs.",

                tip: "La citation parfaite pour justifier théoriquement la division internationale du travail (DIT) et l'ouverture des frontières économiques dans une EC1 ou EC3."
            },
            {

                theme: "Structure & Stratification sociale",

            },

                theme: "Mobilité sociale & Inégalités",

                theme: "Mutations du travail & Lien social",
                thesis: "La division du travail moderne produit une solidarité organique basée sur la complémentarité.",

                thesis: "Les Trente Glorieuses ont provoqué une harmonisation des modes de vie et l'essor d'une vaste classe moyenne.",
                quote: "La constellation centrale (la classe moyenne) absorbe progressivement les anciens clivages de classes pour former une société en forme de toupie.",
                tip: "Le concept central à mobiliser pour argumenter en faveur de la thèse de la 'moyennisation' de la société française (affaiblissement des distances inter-classes)."
            },
            {
                name: "Robert Castel",
                theme: "Mutations du travail & Exclusion",
                thesis: "La précarité de l'emploi fragilise le socle protecteur de la citoyenneté, menant à l'exclusion.",
                quote: "La désaffiliation n'est pas l'absence de liens, mais le produit d'un double processus d'effritement du rapport au travail et d'isolement relationnel.",
                tip: "La référence incontournable pour analyser l'impact du chômage de masse ou de l'emploi précaire sur la cohésion sociale et la qualité d'un emploi."
            }
        ];

        // Algorithme de mélange (Fisher-Yates)[cite: 1]
        const shuffle = (array) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        };

        function App() {
            // Sélecteur de niveau : 'premiere' ou 'terminale'
            const [gradeLevel, setGradeLevel] = useState('terminale');

            const [selectedChapter, setSelectedChapter] = useState(null);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [selectedOptionIndex, setSelectedOptionIndex] = useState(null);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [score, setScore] = useState(0);
            const [userAnswers, setUserAnswers] = useState([]);
            const [view, setView] = useState('dashboard'); // 'dashboard', 'quiz', 'summary', 'authors'

            const currentQuizData = gradeLevel === 'premiere' ? quizDataPremiere : quizDataTerminale;

            // Réserve d'erreurs
            const [wrongQuestions, setWrongQuestions] = useState(() => {
                const saved = localStorage.getItem('ses_wrong_questions');
                return saved ? JSON.parse(saved) : [];
            });
            const [isRemediationMode, setIsRemediationMode] = useState(false);

            // Suivi des Records
            const [highScores, setHighScores] = useState(() => {
                const saved = localStorage.getItem('ses_high_scores');
                return saved ? JSON.parse(saved) : {};
            });

            // Chronomètre de 15 minutes[cite: 1]
            const [isTimerActive, setIsTimerActive] = useState(false);
            const [timeLeft, setTimeLeft] = useState(900);

            // MathJax typesetting[cite: 1]
            useEffect(() => {
                if (window.MathJax && window.MathJax.typeset) {
                    window.MathJax.typeset();
                }
            }, [currentQuestionIndex, view, isSubmitted]);

            // Gestion du compte à rebours[cite: 1]
            useEffect(() => {
                let timer;
                if (view === 'quiz' && isTimerActive && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft((prev) => prev - 1);
                    }, 1000);
                } else if (timeLeft === 0 && view === 'quiz') {
                    setView('summary');
                }
                return () => clearInterval(timer);
            }, [view, isTimerActive, timeLeft]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const handleStartQuiz = (chapter) => {
                setIsRemediationMode(false);
                const originalChapter = currentQuizData.find(c => c.id === chapter.id) || chapter;
                const randomQuestions = shuffle(originalChapter.questions);
                const finalShuffledQuestions = randomQuestions.map(q => ({
                    ...q,
                    options: shuffle(q.options)
                }));

                setSelectedChapter({
                    ...originalChapter,
                    questions: finalShuffledQuestions
                });
                resetQuizState();
            };

            const handleStartGlobalExam = () => {
                setIsRemediationMode(false);
                let poolGlobal = [];
                currentQuizData.forEach(chap => {
                    poolGlobal = poolGlobal.concat(chap.questions);
                });

                const pickedQuestions = shuffle(poolGlobal).slice(0, 20);
                const finalQuestions = pickedQuestions.map(q => ({
                    ...q,
                    options: shuffle(q.options)
                }));

                setSelectedChapter({
                    id: gradeLevel === 'premiere' ? "marathon_premiere" : "bac_blanc",
                    title: gradeLevel === 'premiere' ? "Grand Marathon de 1ère - Épreuve Globale" : "Marathon Bac Blanc - Épreuve Globale",
                    questions: finalQuestions
                });
                resetQuizState();
            };

            const handleStartRemediation = () => {
                if (wrongQuestions.length === 0) return;
                setIsRemediationMode(true);

                setSelectedChapter({
                    id: "remediation",
                    title: "Module de Remédiation Personnalisé",
                    questions: shuffle(wrongQuestions).map(q => ({
                        ...q,
                        options: shuffle(q.options)
                    }))
                });
                resetQuizState();
            };

            const resetQuizState = () => {
                setCurrentQuestionIndex(0);
                setSelectedOptionIndex(null);
                setIsSubmitted(false);
                setScore(0);
                setUserAnswers([]);
                setTimeLeft(900);
                setView('quiz');
            };

            const handleOptionSelect = (index) => {
                if (isSubmitted) return;
                setSelectedOptionIndex(index);
            };

            const handleSubmitAnswer = () => {
                if (selectedOptionIndex === null) return;

                const questionObj = selectedChapter.questions[currentQuestionIndex];
                const selectedOption = questionObj.options[selectedOptionIndex];
                const correctOptionIndex = questionObj.options.findIndex(opt => opt.isCorrect);
                const isCorrect = selectedOption.isCorrect;

                if (isCorrect) {
                    setScore(prev => prev + 1);
                    if (isRemediationMode) {
                        setWrongQuestions(prev => {
                            const updated = prev.filter(q => q.question !== questionObj.question);
                            localStorage.setItem('ses_wrong_questions', JSON.stringify(updated));
                            if (updated.length === 0) {
                                localStorage.setItem('ses_remediation_baseline', '0');
                            }
                            return updated;
                        });
                    }
                } else {
                    setWrongQuestions(prev => {
                        if (prev.some(q => q.question === questionObj.question)) return prev;
                        const updated = [...prev, questionObj];
                        localStorage.setItem('ses_wrong_questions', JSON.stringify(updated));

                        const baseline = parseInt(localStorage.getItem('ses_remediation_baseline') || '0');
                        if (updated.length > baseline) {
                            localStorage.setItem('ses_remediation_baseline', updated.length.toString());
                        }
                        return updated;
                    });
                }

                setUserAnswers([...userAnswers, {
                    question: questionObj.question,
                    selectedOptionText: selectedOption.text,
                    correctOptionText: questionObj.options[correctOptionIndex].text,
                    isCorrect: isCorrect,
                    rationale: questionObj.options[correctOptionIndex].rationale
                }]);

                setIsSubmitted(true);
            };

            const handleNextQuestion = () => {
                if (currentQuestionIndex + 1 < selectedChapter.questions.length) {
                    setCurrentQuestionIndex(prev => prev + 1);
                    setSelectedOptionIndex(null);
                    setIsSubmitted(false);
                } else {
                    if (!isRemediationMode) {
                        const currentHighScore = highScores[selectedChapter.id] || 0;
                        if (score > currentHighScore) {
                            const updatedScores = { ...highScores, [selectedChapter.id]: score };
                            localStorage.setItem('ses_high_scores', JSON.stringify(updatedScores));
                            setHighScores(updatedScores);
                        }
                    }
                    setView('summary');
                }
            };

            const errorBaseline = Math.max(wrongQuestions.length, parseInt(localStorage.getItem('ses_remediation_baseline') || '0'));
            const errorsCleared = errorBaseline - wrongQuestions.length;
            const recoveryPercent = errorBaseline > 0 ? Math.round((errorsCleared / errorBaseline) * 100) : 0;

            const examId = gradeLevel === 'premiere' ? "marathon_premiere" : "bac_blanc";
            const bestExamScore = highScores[examId];
            let examMedal = null;
            if (bestExamScore !== undefined) {
                if (bestExamScore === 20) examMedal = "🥇";
                else if (bestExamScore >= 16) examMedal = "🥈";
                else if (bestExamScore >= 10) examMedal = "🥉";
            }

            return (
                <div class="min-h-screen flex flex-col justify-between">
                    {/* BARRE DE NAVIGATION BANDEAU */}
                    <header class="bg-white border-b border-slate-200 py-4 shadow-sm sticky top-0 z-50">
                        <div class="max-w-5xl mx-auto px-4 flex flex-wrap gap-4 justify-between items-center">
                            <div class="flex items-center space-x-3 cursor-pointer" onClick={() => setView('dashboard')}>
                                <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-2.5 rounded-xl text-white shadow-md shadow-indigo-100">
                                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                                </div>
                                <div>
                                    <h1 class="font-extrabold text-lg text-slate-900 tracking-tight">SES Master Quiz - M. Chachero</h1>
                                    <p class="text-xs text-slate-500 font-medium">Spécialité SES Lycée</p>
                                </div>
                            </div>

                            {/* BOUTONS D'ACTIONS & SÉLECTEUR DE NIVEAU */}
                            <div class="flex items-center space-x-2 sm:space-x-3">
                                {/* SÉLECTEUR DE CLASSE */}
                                {view === 'dashboard' && (
                                    <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-bold">
                                        <button 
                                            onClick={() => setGradeLevel('premiere')} 
                                            class={`px-3 py-1.5 rounded-lg transition ${gradeLevel === 'premiere' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                                        >
                                            1ère (12 chap.)
                                        </button>
                                        <button 
                                            onClick={() => setGradeLevel('terminale')} 
                                            class={`px-3 py-1.5 rounded-lg transition ${gradeLevel === 'terminale' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                                        >
                                            Terminale (Bac)
                                        </button>
                                    </div>
                                )}

                                {/* BOUTON REMÉDIATION */}
                                {(view === 'dashboard' || view === 'authors') && (
                                    <button 
                                        onClick={wrongQuestions.length > 0 ? handleStartRemediation : null}
                                        disabled={wrongQuestions.length === 0}
                                        class={`text-xs sm:text-sm font-bold px-3 py-2 rounded-xl flex items-center space-x-1.5 transition border ${
                                            wrongQuestions.length > 0 
                                                ? "text-amber-700 bg-amber-50 hover:bg-amber-100 border-amber-200 shadow-sm" 
                                                : "text-slate-400 bg-slate-50 border-slate-200 opacity-60 cursor-not-allowed"
                                        }`}
                                    >
                                        <i class="fa-solid fa-kit-medical"></i>
                                        <span>Erreurs {wrongQuestions.length > 0 ? `(${wrongQuestions.length})` : ""}</span>
                                    </button>
                                )}

                                {/* BOUTON CITATIONS & AUTEURS */}
                                {view !== 'authors' && (
                                    <button 
                                        onClick={() => setView('authors')}
                                        class="text-xs sm:text-sm font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-2 rounded-xl flex items-center space-x-1.5 transition border border-indigo-100"
                                    >
                                        <i class="fa-solid fa-book-bookmark"></i>
                                        <span class="hidden md:inline">Citations & Auteurs</span>
                                    </button>
                                )}
                                
                                {view !== 'dashboard' && (
                                    <button onClick={() => setView('dashboard')} class="text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 flex items-center space-x-1.5 transition">
                                        <i class="fa-solid fa-arrow-left"></i>
                                        <span>Accueil</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* ZONE CENTRALE DYNAMIQUE */}
                    <main class="max-w-5xl w-full mx-auto px-4 py-8 flex-grow flex items-center justify-center">

                        {/* VIEW 1 : TABLEAU DE BORD ACCUEIL */}
                        {view === 'dashboard' && (
                            <div class="w-full">
                                <div class="text-center mb-8">
                                    <span class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider">
                                        Niveau actif : {gradeLevel === 'premiere' ? 'Spécialité Première (12 chapitres)' : 'Spécialité Terminale (Baccalauréat)'}
                                    </span>
                                    <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight mt-3 mb-2">
                                        {gradeLevel === 'premiere' ? 'Réviser le Programme de Première' : "S'entraîner pour le Baccalauréat"}
                                    </h2>
                                    <p class="text-slate-500 max-w-xl mx-auto text-sm">
                                        Choisissez un chapitre ou lancez une épreuve transversale aléatoire pour tester vos connaissances.
                                    </p>
                                </div>

                                {/* PANNEAU DE COMMANDE COMBINÉ (CHRONO + MARATHON) */}
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl mx-auto mb-10">
                                    <div class="flex items-center space-x-4 bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                                        <div class="bg-slate-100 p-2.5 rounded-xl text-slate-600"><i class="fa-solid fa-stopwatch text-lg"></i></div>
                                        <div class="flex-grow">
                                            <span class="block text-sm font-bold text-slate-800">Mode Chronométré</span>
                                            <span class="block text-xs text-slate-400 font-medium">15 minutes par session</span>
                                        </div>
                                        <button onClick={() => setIsTimerActive(!isTimerActive)} class={`relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${isTimerActive ? 'bg-blue-600' : 'bg-slate-200'}`}>
                                            <span class={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${isTimerActive ? 'translate-x-5' : 'translate-x-0'}`}></span>
                                        </button>
                                    </div>

                                    <div class="bg-gradient-to-br from-violet-600 to-indigo-700 text-white border border-indigo-100 rounded-2xl p-4 shadow-sm hover:shadow-md transition duration-300 flex items-center justify-between cursor-pointer group" onClick={handleStartGlobalExam}>
                                        <div class="flex items-center space-x-4">
                                            <div class="w-10 h-10 rounded-xl bg-white/20 text-white flex items-center justify-center shadow-md"><i class="fa-solid fa-file-signature text-base"></i></div>
                                            <div>
                                                <h3 class="font-extrabold text-white text-sm leading-tight">
                                                    {gradeLevel === 'premiere' ? 'Grand Quiz Transversal 1ère' : 'Marathon Bac Blanc'}
                                                </h3>
                                                <p class="text-[11px] text-indigo-100 font-medium">20 questions mélangées</p>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            {bestExamScore !== undefined && (
                                                <span class="text-xs font-extrabold bg-white/20 px-2 py-0.5 rounded-full border border-white/10">
                                                    {examMedal} {bestExamScore}/20
                                                </span>
                                            )}
                                            <i class="fa-solid fa-play group-hover:translate-x-1 transition text-xs"></i>
                                        </div>
                                    </div>
                                </div>

                                {/* GRILLE DES CHAPITRES */}
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {currentQuizData.map((chap) => {
                                        const bestScore = highScores[chap.id];
                                        let medalElement = null;

                                        if (bestScore !== undefined) {
                                            const successRatio = bestScore / chap.questions.length;
                                            if (successRatio === 1) medalElement = { icon: "fa-trophy text-amber-500 text-lg", bg: "bg-amber-50 border-amber-200 text-amber-800" };
                                            else if (successRatio >= 0.75) medalElement = { icon: "fa-medal text-slate-400 text-lg", bg: "bg-slate-50 border-slate-200 text-slate-700" };
                                            else if (successRatio >= 0.5) medalElement = { icon: "fa-medal text-amber-700 text-lg", bg: "bg-orange-50 border-orange-100 text-orange-800" };
                                        }

                                        return (
                                            <div key={chap.id} class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm hover:shadow-md transition duration-300 flex flex-col justify-between cursor-pointer group" onClick={() => handleStartQuiz(chap)}>
                                                <div>
                                                    <div class="flex justify-between items-start mb-4">
                                                        <div class={`w-12 h-12 rounded-xl bg-gradient-to-br ${chap.color} text-white flex items-center justify-center shadow-lg shadow-slate-100 group-hover:scale-105 transition`}><i class={`fa-solid ${chap.icon} text-lg`}></i></div>
                                                        {medalElement && (
                                                            <span class={`flex items-center space-x-1.5 border px-2.5 py-1 rounded-full text-xs font-extrabold shadow-sm ${medalElement.bg}`}>
                                                                <i class={`fa-solid ${medalElement.icon}`}></i>
                                                                <span>{bestScore}/{chap.questions.length}</span>
                                                            </span>
                                                        )}
                                                    </div>
                                                    <h3 class="font-bold text-slate-900 text-base leading-tight mb-2 group-hover:text-blue-600 transition">{chap.title}</h3>
                                                    <p class="text-xs text-slate-500 font-medium">{chap.questions.length} Questions disponibles</p>
                                                </div>
                                                <div class="mt-6 flex items-center justify-between text-xs font-semibold text-blue-600 pt-4 border-t border-slate-50">
                                                    <span>{bestScore !== undefined ? "Recommencer" : "Démarrer"}</span>
                                                    <i class="fa-solid fa-chevron-right group-hover:translate-x-1 transition"></i>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* VIEW 2 : CITATIONS & AUTEURS */}
                        {view === 'authors' && (
                            <div class="w-full max-w-4xl">
                                <div class="text-center mb-8">
                                    <span class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider">Boîte à outils Pédagogique</span>
                                    <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight mt-3 mb-1">Dictionnaire des Citations & Auteurs</h2>
                                    <p class="text-slate-500 text-sm">Les concepts théoriques incontournables pour étayer vos raisonnements et dissertations.</p>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {authorsData.map((author, index) => (
                                        <div key={index} class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between space-y-4">
                                            <div>
                                                <div class="flex justify-between items-start mb-2">
                                                    <h3 class="font-extrabold text-slate-900 text-lg">{author.name}</h3>
                                                    <span class="bg-slate-100 text-slate-600 text-xs font-semibold px-2.5 py-1 rounded-md">{author.theme}</span>
                                                </div>
                                                <p class="text-xs text-indigo-600 font-bold mb-3 uppercase tracking-wider">Thèse : {author.thesis}</p>
                                                <div class="bg-slate-50 border-l-4 border-indigo-500 p-3 rounded-r-xl my-2">
                                                    <p class="text-sm italic font-medium text-slate-700 leading-relaxed">« {author.quote} »</p>
                                                </div>
                                            </div>
                                            <div class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-3 text-xs text-emerald-800 leading-relaxed">
                                                <strong>💡 Utilisation type :</strong> {author.tip}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div class="text-center mt-8">
                                    <button onClick={() => setView('dashboard')} class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-8 rounded-xl transition text-sm shadow-md">Retourner aux quiz</button>
                                </div>
                            </div>
                        )}

                        {/* VIEW 3 : SESSION ACTIVE DU QUIZ */}
                        {view === 'quiz' && selectedChapter && (
                            <div class="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-xl max-w-2xl w-full">
                                <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-6">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">{selectedChapter.title}</span>
                                    <div class="flex items-center space-x-3">
                                        {isTimerActive && (
                                            <span class={`text-xs font-extrabold px-3 py-1.5 rounded-full flex items-center space-x-1.5 ${timeLeft < 60 ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-amber-100 text-amber-700'}`}>
                                                <i class="fa-solid fa-clock"></i>
                                                <span>{formatTime(timeLeft)}</span>
                                            </span>
                                        )}
                                        <span class="bg-slate-100 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-full">Question {currentQuestionIndex + 1} / {selectedChapter.questions.length}</span>
                                    </div>
                                </div>

                                <div class="w-full bg-slate-100 h-1.5 rounded-full mb-6">
                                    <div class="bg-blue-600 h-1.5 rounded-full transition-all duration-300" style={{ width: `${((currentQuestionIndex + 1) / selectedChapter.questions.length) * 100}%` }}></div>
                                </div>

                                <h3 class="text-lg font-bold text-slate-900 mb-6 leading-snug">{selectedChapter.questions[currentQuestionIndex].question}</h3>

                                <div class="space-y-3 mb-6">
                                    {selectedChapter.questions[currentQuestionIndex].options.map((opt, idx) => {
                                        let optionBgClass = "border-slate-200 hover:border-blue-500 hover:bg-slate-50";
                                        let icon = null;

                                        if (selectedOptionIndex === idx) optionBgClass = "border-blue-500 bg-blue-50";

                                        if (isSubmitted) {
                                            if (opt.isCorrect) {
                                                optionBgClass = "border-emerald-500 bg-emerald-50 text-emerald-900";
                                                icon = <i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>;
                                            } else if (selectedOptionIndex === idx) {
                                                optionBgClass = "border-rose-500 bg-rose-50 text-rose-900";
                                                icon = <i class="fa-solid fa-circle-xmark text-rose-600 text-lg"></i>;
                                            } else {
                                                optionBgClass = "border-slate-200 opacity-60";
                                            }
                                        }

                                        return (
                                            <button key={idx} onClick={() => handleOptionSelect(idx)} disabled={isSubmitted} class={`w-full text-left border rounded-2xl p-4 flex justify-between items-center transition font-medium text-sm leading-relaxed ${optionBgClass}`}>
                                                <span>{opt.text}</span>
                                                {icon}
                                            </button>
                                        );
                                    })}
                                </div>

                                {isSubmitted ? (
                                    <div class="mt-6 pt-6 border-t border-slate-100">
                                        <div class={`p-4 rounded-2xl mb-6 text-sm leading-relaxed ${selectedChapter.questions[currentQuestionIndex].options[selectedOptionIndex].isCorrect ? "bg-emerald-50 text-emerald-800 border border-emerald-100" : "bg-rose-50 text-rose-800 border border-rose-100"}`}>
                                            <p class="font-bold mb-1">{selectedChapter.questions[currentQuestionIndex].options[selectedOptionIndex].isCorrect ? "Correct !" : "Incorrect"}</p>
                                            <p>{selectedChapter.questions[currentQuestionIndex].options[selectedOptionIndex].rationale}</p>
                                        </div>
                                        <button onClick={handleNextQuestion} class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 px-6 rounded-2xl transition shadow-md">Question suivante</button>
                                    </div>
                                ) : (
                                    <button onClick={handleSubmitAnswer} disabled={selectedOptionIndex === null} class={`w-full font-bold py-4 px-6 rounded-2xl transition shadow-md ${selectedOptionIndex !== null ? "bg-blue-600 hover:bg-blue-700 text-white" : "bg-slate-100 text-slate-400 cursor-not-allowed"}`}>Valider</button>
                                )}
                            </div>
                        )}

                        {/* VIEW 4 : BILAN DE FIN DE QUIZ */}
                        {view === 'summary' && selectedChapter && (
                            <div class="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-xl max-w-2xl w-full">
                                <div class="text-center mb-8">
                                    <div class={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${timeLeft === 0 ? 'bg-rose-50 text-rose-600' : 'bg-indigo-50 text-indigo-600'}`}><i class={`fa-solid ${timeLeft === 0 ? 'fa-hourglass-end animate-bounce' : 'fa-trophy'} text-2xl`}></i></div>
                                    <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">{timeLeft === 0 ? "Temps Écoulé !" : isRemediationMode ? "Remédiation Terminée !" : "Fin de la session"}</h2>
                                    <p class="text-slate-500 text-sm mt-1">{selectedChapter.title}</p>
                                </div>

                                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 text-center mb-8">
                                    <p class="text-sm font-bold text-slate-500 uppercase tracking-widest">Score obtenu</p>
                                    <h3 class="text-5xl font-extrabold text-slate-900 mt-2 mb-1">{score} / {selectedChapter.questions.length}</h3>
                                </div>

                                <div class="space-y-4 mb-8 max-h-[250px] overflow-y-auto pr-2">
                                    <h4 class="font-bold text-sm text-slate-900 border-b border-slate-100 pb-2">Récapitulatif des réponses :</h4>
                                    {userAnswers.map((ans, idx) => (
                                        <div key={idx} class="p-4 border border-slate-150 rounded-xl text-xs space-y-1.5 leading-relaxed bg-slate-50">
                                            <p class="font-bold text-slate-800">Q{idx + 1}: {ans.question}</p>
                                            <div class="flex items-center space-x-2">
                                                <span class="font-semibold text-slate-500">Votre choix :</span>
                                                <span class={ans.isCorrect ? "text-emerald-600 font-bold" : "text-rose-600 font-bold"}>{ans.selectedOptionText}</span>
                                            </div>
                                            {!ans.isCorrect && (
                                                <div class="flex items-center space-x-2">
                                                    <span class="font-semibold text-slate-500">Réponse attendue :</span>
                                                    <span class="text-emerald-600 font-bold">{ans.correctOptionText}</span>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <div class="flex space-x-4">
                                    <button onClick={() => { selectedChapter.id === examId ? handleStartGlobalExam() : handleStartQuiz(selectedChapter) }} class="flex-1 border border-slate-200 hover:border-slate-300 font-bold py-4 px-6 rounded-2xl transition text-slate-700 text-sm">Recommencer</button>
                                    <button onClick={() => setView('dashboard')} class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl transition shadow-md text-sm">Retour à l'accueil</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Pied de page */}
                    <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400 font-medium">
                        <div class="max-w-5xl mx-auto px-4">
                            <p>© 2026 Plateforme SES Lycée - Joël Chachero</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
